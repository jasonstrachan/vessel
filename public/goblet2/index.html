<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vessel Goblet 2 Viewer</title>
    <style>
      @font-face { font-family: 'MEK Sans'; src: url('../assets/fonts/MEKSANS-REGULAR.OTF') format('opentype'); font-display: block; }
      @font-face { font-family: 'MEK Mono'; src: url('../assets/fonts/MEK-MONO-REGULAR.OTF') format('opentype'); font-display: block; }
      @font-face { font-family: 'JetBrains Mono'; src: url('../assets/fonts/JETBRAINS-MONO-REGULAR.WOFF2') format('woff2'); font-display: block; }
      @font-face { font-family: 'IBM Plex Mono'; src: url('../assets/fonts/IBM-PLEX-MONO-REGULAR.WOFF2') format('woff2'); font-display: block; }
      @font-face { font-family: 'Departure Mono'; src: url('../assets/fonts/DEPARTURE-MONO-REGULAR.WOFF2') format('woff2'); font-display: block; }
      @font-face { font-family: 'Tiny5'; src: url('../assets/fonts/TINY5-REGULAR.WOFF2') format('woff2'); font-display: block; }
      @font-face { font-family: 'm3x6'; src: url('../assets/fonts/M3X6-REGULAR.TTF') format('truetype'); font-display: block; }
      @font-face { font-family: 'Monogram'; src: url('../assets/fonts/MONOGRAM-REGULAR.TTF') format('truetype'); font-display: block; }
      @font-face { font-family: 'Silkscreen'; src: url('../assets/fonts/SILKSCREEN-REGULAR.TTF') format('truetype'); font-display: block; }
      @font-face { font-family: 'Spleen 6x12'; src: url('../assets/fonts/SPLEEN-6X12.WOFF2') format('woff2'); font-display: block; }
      @font-face { font-family: 'Fusion Pixel 8px Mono'; src: url('../assets/fonts/FUSION-PIXEL-8PX-MONO-LATIN.WOFF2') format('woff2'); font-display: block; }
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        cursor: default;
        user-select: none;
      }
      body[data-viewport-preset='embed-fill'],
      body[data-viewport-preset='embed-fit'] {
        overflow: hidden;
      }
      canvas {
        display: block;
        background: #000;
        image-rendering: pixelated;
      }
      #goblet-status {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(12, 17, 24, 0.7);
        color: #fff;
        font: 500 14px/1.4 'IBM Plex Mono', 'Courier New', monospace;
        letter-spacing: 0.01em;
        text-align: center;
        pointer-events: none;
        transition: opacity 160ms ease;
        opacity: 0;
        max-width: min(90vw, 480px);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
      #goblet-status[data-visible='true'] {
        opacity: 1;
      }
      #goblet-status[data-level='error'] {
        color: #ff8686;
      }
    </style>
  </head>
  <body>
    <canvas id="preview-canvas" aria-hidden="true"></canvas>
    <input id="file-input" type="file" accept="application/json" hidden />

    <script type="module">
      import {
        renderVesselWebGL,
        resizeVesselWebGL,
        debugLog,
        isGobletDiagnosticsEnabled,
        setGobletDiagnosticsEnabled
      } from './goblet2.js';

      const canvas = document.getElementById('preview-canvas');
      const fileInput = document.getElementById('file-input');
      let isRendering = false;
      let pendingMetadata = null;
      let lastMetadata = null;

      const statusElement = (() => {
        const element = document.createElement('div');
        element.id = 'goblet-status';
        element.setAttribute('role', 'status');
        element.dataset.visible = 'false';
        element.dataset.level = 'info';
        document.body.appendChild(element);
        return element;
      })();

      const isDiagnosticsEnabled = () => isGobletDiagnosticsEnabled();

      window.vesselGobletSetDiagnostics = (value) => setGobletDiagnosticsEnabled(value);

      const setStatus = (message, level = 'info') => {
        const text = typeof message === 'string' ? message.trim() : '';
        const severity = level === 'error' ? 'error' : 'info';

        if (severity === 'info') {
          statusElement.textContent = '';
          statusElement.dataset.visible = 'false';
          statusElement.dataset.level = 'info';
          return;
        }

        statusElement.dataset.level = 'error';
        if (text) {
          statusElement.textContent = text;
          statusElement.dataset.visible = 'true';
          console.error('[Vessel Goblet]', text);
        } else {
          statusElement.textContent = '';
          statusElement.dataset.visible = 'false';
        }
      };

      const summarizeMetadata = () => {};

      let txtShapeResizeObserver = null;
      let txtShapePositionCleanup = null;
      const mountTxtShapes = (metadata) => {
        txtShapePositionCleanup?.();
        txtShapePositionCleanup = null;
        txtShapeResizeObserver?.disconnect();
        txtShapeResizeObserver = null;
        document.getElementById('vessel-txt-shapes')?.remove();
        const layerById = new Map((Array.isArray(metadata?.layers) ? metadata.layers : [])
          .map((layer) => [String(layer?.id || ''), layer]));
        const shapes = (Array.isArray(metadata?.textShapes) ? metadata.textShapes : [])
          .filter((shape) => {
            const owner = layerById.get(String(shape?.layerId || ''));
            return owner && owner.visible !== false;
          });
        const textFonts = {
          'mek-sans': { stack: "'MEK Sans', sans-serif", minimumSize: 10, sizeStep: 1 },
          'mek-mono': { stack: "'MEK Mono', monospace", minimumSize: 12, sizeStep: 1 },
          'jetbrains-mono': { stack: "'JetBrains Mono', monospace", minimumSize: 8, sizeStep: 1 },
          'ibm-plex-mono': { stack: "'IBM Plex Mono', monospace", minimumSize: 8, sizeStep: 1 },
          'departure-mono': {
            stack: "'Departure Mono', monospace",
            minimumSize: 11,
            sizeStep: 11,
            nativeSize: 11,
          },
          'tiny5': { stack: "'Tiny5', monospace", minimumSize: 8, sizeStep: 8, nativeSize: 8 },
          'm3x6': { stack: "'m3x6', monospace", minimumSize: 16, sizeStep: 16, nativeSize: 16 },
          'monogram': { stack: "'Monogram', monospace", minimumSize: 16, sizeStep: 16, nativeSize: 16 },
          'silkscreen': { stack: "'Silkscreen', monospace", minimumSize: 8, sizeStep: 8, nativeSize: 8 },
          'spleen-6x12': { stack: "'Spleen 6x12', monospace", minimumSize: 12, sizeStep: 12, nativeSize: 12 },
          'fusion-pixel-8px-mono': {
            stack: "'Fusion Pixel 8px Mono', monospace",
            minimumSize: 8,
            sizeStep: 8,
            nativeSize: 8,
          },
        };
        const getTextFontMetrics = (shape) => {
          const font = textFonts[shape.fontFamily] || textFonts['mek-mono'];
          const requestedSize = Number(shape.fontSize) || 24;
          const maximumSize = Math.max(font.minimumSize, 40);
          let fontSize;
          if (font.nativeSize) {
            const maximumScale = Math.max(1, Math.floor(maximumSize / font.nativeSize));
            const scale = Math.max(
              1,
              Math.min(maximumScale, Math.round(requestedSize / font.nativeSize)),
            );
            fontSize = font.nativeSize * scale;
          } else {
            const steppedSize = font.minimumSize
              + Math.round((requestedSize - font.minimumSize) / font.sizeStep) * font.sizeStep;
            fontSize = Math.max(font.minimumSize, Math.min(maximumSize, steppedSize));
          }
          const rasterSize = font.nativeSize || fontSize;
          const rasterScale = font.nativeSize ? fontSize / font.nativeSize : 1;
          const lineHeight = Math.max(
            1,
            Math.round(rasterSize * (Number(shape.lineHeight) || 1.2)),
          ) * rasterScale;
          return { font, fontSize, lineHeight };
        };
        if (!(canvas instanceof HTMLCanvasElement) || shapes.length === 0) return;
        const overlay = document.createElement('div');
        overlay.id = 'vessel-txt-shapes';
        overlay.style.position = 'absolute';
        overlay.style.overflow = 'hidden';
        overlay.style.pointerEvents = 'none';
        overlay.style.zIndex = '10';
        const stage = document.createElement('div');
        stage.style.position = 'absolute';
        stage.style.left = '0';
        stage.style.top = '0';
        stage.style.width = `${Math.max(1, Number(metadata.project?.width) || 1)}px`;
        stage.style.height = `${Math.max(1, Number(metadata.project?.height) || 1)}px`;
        stage.style.transformOrigin = 'top left';
        const style = document.createElement('style');
        style.textContent = [
          '#vessel-txt-shapes [data-txt-shape-id]::selection, #vessel-txt-shapes [data-txt-shape-id] *::selection { color: var(--txt-selection-color); background: var(--txt-selection-bg); }',
          '#vessel-txt-shapes [data-inactive-state="none"]:not([data-canonical-selected]):not([data-vessel-txt-cell-selected="true"]) { color: var(--txt-base-color); background: transparent; box-shadow: none; opacity: 1; text-decoration: none; visibility: visible; }',
          '#vessel-txt-shapes [data-canonical-selected], #vessel-txt-shapes [data-vessel-txt-cell-selected="true"], #vessel-txt-shapes [data-non-canonical-state="selected"], #vessel-txt-shapes [data-inactive-state="selected"]:not([data-canonical-selected]):not([data-vessel-txt-cell-selected="true"]) { color: var(--txt-selection-color); background: var(--txt-selection-bg); box-shadow: 0 var(--txt-selection-fill-gap, 0px) 0 var(--txt-selection-bg); }',
          '#vessel-txt-shapes [data-selection-treatment="crossed-out"][data-canonical-selected], #vessel-txt-shapes [data-selection-treatment="crossed-out"][data-vessel-txt-cell-selected="true"], #vessel-txt-shapes [data-selection-treatment="crossed-out"][data-non-canonical-state], #vessel-txt-shapes [data-inactive-state="crossed-out"]:not([data-canonical-selected]):not([data-vessel-txt-cell-selected="true"]) { color: var(--txt-base-color); background: transparent; box-shadow: none; text-decoration-line: line-through; text-decoration-color: var(--txt-selection-bg); text-decoration-thickness: 0.1em; }',
          '#vessel-txt-shapes [data-selection-treatment="selected-crossed-out"][data-canonical-selected], #vessel-txt-shapes [data-selection-treatment="selected-crossed-out"][data-vessel-txt-cell-selected="true"], #vessel-txt-shapes [data-selection-treatment="selected-crossed-out"][data-non-canonical-state], #vessel-txt-shapes [data-inactive-state="selected-crossed-out"]:not([data-canonical-selected]):not([data-vessel-txt-cell-selected="true"]) { color: var(--txt-selection-color); background: var(--txt-selection-bg); box-shadow: 0 var(--txt-selection-fill-gap, 0px) 0 var(--txt-selection-bg); text-decoration-line: line-through; text-decoration-color: var(--txt-selection-color); text-decoration-thickness: 0.1em; }',
          '#vessel-txt-shapes [data-selection-treatment="overwritten"], #vessel-txt-shapes [data-inactive-state="overwritten"] { position: relative; }',
          '#vessel-txt-shapes [data-selection-treatment="overwritten"][data-canonical-selected], #vessel-txt-shapes [data-selection-treatment="overwritten"][data-vessel-txt-cell-selected="true"], #vessel-txt-shapes [data-selection-treatment="overwritten"][data-non-canonical-state], #vessel-txt-shapes [data-inactive-state="overwritten"]:not([data-canonical-selected]):not([data-vessel-txt-cell-selected="true"]) { color: var(--txt-base-color); background: transparent; box-shadow: none; }',
          '#vessel-txt-shapes [data-selection-treatment="overwritten"][data-canonical-selected]::after, #vessel-txt-shapes [data-selection-treatment="overwritten"][data-vessel-txt-cell-selected="true"]::after, #vessel-txt-shapes [data-selection-treatment="overwritten"][data-non-canonical-state]::after, #vessel-txt-shapes [data-inactive-state="overwritten"]:not([data-canonical-selected]):not([data-vessel-txt-cell-selected="true"])::after { content: attr(data-overwrite-text); position: absolute; left: 1px; top: -1px; color: var(--txt-selection-bg); text-shadow: -1px 1px 0 var(--txt-selection-bg); }',
          '#vessel-txt-shapes [data-selection-treatment="erased"][data-canonical-selected], #vessel-txt-shapes [data-selection-treatment="erased"][data-vessel-txt-cell-selected="true"], #vessel-txt-shapes [data-selection-treatment="erased"][data-non-canonical-state], #vessel-txt-shapes [data-inactive-state="erased"]:not([data-canonical-selected]):not([data-vessel-txt-cell-selected="true"]) { color: var(--txt-base-color); background: transparent; box-shadow: none; opacity: 0.38; -webkit-mask-image: repeating-linear-gradient(to bottom, #000 0 0.12em, transparent 0.12em 0.34em); mask-image: repeating-linear-gradient(to bottom, #000 0 0.12em, transparent 0.12em 0.34em); }',
          '#vessel-txt-shapes [data-selection-treatment="redacted"][data-canonical-selected], #vessel-txt-shapes [data-selection-treatment="redacted"][data-vessel-txt-cell-selected="true"], #vessel-txt-shapes [data-selection-treatment="redacted"][data-non-canonical-state], #vessel-txt-shapes [data-inactive-state="redacted"]:not([data-canonical-selected]):not([data-vessel-txt-cell-selected="true"]) { color: transparent; background: var(--txt-selection-bg); box-shadow: 0 var(--txt-selection-fill-gap, 0px) 0 var(--txt-selection-bg); }',
          '#vessel-txt-shapes [data-selection-treatment="redacted-crossed-out"][data-canonical-selected], #vessel-txt-shapes [data-selection-treatment="redacted-crossed-out"][data-vessel-txt-cell-selected="true"], #vessel-txt-shapes [data-selection-treatment="redacted-crossed-out"][data-non-canonical-state], #vessel-txt-shapes [data-inactive-state="redacted-crossed-out"]:not([data-canonical-selected]):not([data-vessel-txt-cell-selected="true"]) { color: transparent; background: var(--txt-selection-bg); box-shadow: 0 var(--txt-selection-fill-gap, 0px) 0 var(--txt-selection-bg); text-decoration-line: line-through; text-decoration-color: var(--txt-selection-color); text-decoration-thickness: 0.1em; }',
          '#vessel-txt-shapes [data-selection-treatment="invisible"][data-canonical-selected], #vessel-txt-shapes [data-selection-treatment="invisible"][data-vessel-txt-cell-selected="true"], #vessel-txt-shapes [data-selection-treatment="invisible"][data-non-canonical-state], #vessel-txt-shapes [data-inactive-state="invisible"]:not([data-canonical-selected]):not([data-vessel-txt-cell-selected="true"]) { color: transparent !important; background: transparent !important; box-shadow: none !important; text-decoration: none !important; visibility: hidden; }',
          '#vessel-txt-shapes [data-selection-treatment="invisible-crossed-out"][data-canonical-selected], #vessel-txt-shapes [data-selection-treatment="invisible-crossed-out"][data-vessel-txt-cell-selected="true"], #vessel-txt-shapes [data-selection-treatment="invisible-crossed-out"][data-non-canonical-state], #vessel-txt-shapes [data-inactive-state="invisible-crossed-out"]:not([data-canonical-selected]):not([data-vessel-txt-cell-selected="true"]) { color: transparent !important; background: transparent !important; box-shadow: none !important; text-decoration-line: line-through !important; text-decoration-color: var(--txt-selection-bg) !important; text-decoration-thickness: 0.1em; visibility: visible; }',
          '#vessel-txt-shapes [data-unmapped-hidden="true"] { color: transparent !important; background: transparent !important; box-shadow: none !important; text-decoration: none !important; }',
        ].join(' ');
        overlay.appendChild(style);
        const getRegionSpan = (shape, y) => {
          const width = Math.max(1, Number(shape.width) || 1);
          const height = Math.max(1, Number(shape.height) || 1);
          if (shape.regionKind === 'oval') {
            const normalizedY = (y / height - 0.5) * 2;
            const halfSpan = Math.sqrt(Math.max(0, 1 - normalizedY * normalizedY)) * width / 2;
            return { left: width / 2 - halfSpan, right: width / 2 + halfSpan };
          }
          const path = Array.isArray(shape.regionPath) ? shape.regionPath : [];
          if (shape.regionKind !== 'freehand' || path.length < 3) return { left: 0, right: width };
          const normalizedY = y / height;
          const intersections = [];
          path.forEach((point, index) => {
            const next = path[(index + 1) % path.length];
            if (!next || Number(point.y) === Number(next.y)) return;
            const pointY = Number(point.y) || 0;
            const nextY = Number(next.y) || 0;
            const crosses = (pointY <= normalizedY && nextY > normalizedY)
              || (nextY <= normalizedY && pointY > normalizedY);
            if (!crosses) return;
            const ratio = (normalizedY - pointY) / (nextY - pointY);
            intersections.push(((Number(point.x) || 0) + ((Number(next.x) || 0) - (Number(point.x) || 0)) * ratio) * width);
          });
          intersections.sort((a, b) => a - b);
          let widest = null;
          for (let index = 0; index + 1 < intersections.length; index += 2) {
            const candidate = { left: intersections[index], right: intersections[index + 1] };
            if (!widest || candidate.right - candidate.left > widest.right - widest.left) widest = candidate;
          }
          return widest;
        };
        const getPadding = (shape) => {
          const width = Math.max(1, Number(shape.width) || 1);
          const height = Math.max(1, Number(shape.height) || 1);
          return Math.max(0, Math.min(Math.min(width, height) / 2 - 0.5, Number(shape.padding) || 0));
        };
        const getFlowInsetPath = (shape, side) => {
          const width = Math.max(1, Number(shape.width) || 1);
          const height = Math.max(1, Number(shape.height) || 1);
          const padding = getPadding(shape);
          const contentWidth = Math.max(1, width - padding * 2);
          const contentHeight = Math.max(1, height - padding * 2);
          const { lineHeight } = getTextFontMetrics(shape);
          const bands = Math.max(1, Math.ceil(contentHeight / lineHeight));
          const points = [side === 'left' ? '0% 0%' : '100% 0%'];
          for (let index = 0; index <= bands; index += 1) {
            const y = Math.min(contentHeight, index * lineHeight);
            const span = getRegionSpan(shape, Math.min(height - padding, padding + y + lineHeight / 2));
            const inset = side === 'left'
              ? Math.max(0, (span?.left ?? width / 2) - padding)
              : Math.max(0, width - padding - (span?.right ?? width / 2));
            const amount = Math.max(0, Math.min(100, inset / Math.max(1, contentWidth / 2) * 100));
            points.push(`${side === 'left' ? amount : 100 - amount}% ${y / contentHeight * 100}%`);
          }
          points.push(side === 'left' ? '0% 100%' : '100% 100%');
          return `polygon(${points.join(', ')})`;
        };
        const getLineBlockClipPath = (shape) => {
          if (shape.regionKind !== 'oval' && shape.regionKind !== 'freehand') return '';
          const width = Math.max(1, Number(shape.width) || 1);
          const height = Math.max(1, Number(shape.height) || 1);
          const { lineHeight } = getTextFontMetrics(shape);
          const bands = Array.from(
            { length: Math.max(1, Math.ceil(height / lineHeight)) },
            (_, index) => {
              const top = index * lineHeight;
              const bottom = Math.min(height, top + lineHeight);
              const span = getRegionSpan(shape, top + (bottom - top) / 2);
              return span && span.right > span.left ? { ...span, top, bottom } : null;
            },
          ).filter(Boolean);
          const point = (x, y) => `${x / width * 100}% ${y / height * 100}%`;
          const left = bands.flatMap((band) => [
            point(band.left, band.top),
            point(band.left, band.bottom),
          ]);
          const right = [...bands].reverse().flatMap((band) => [
            point(band.right, band.bottom),
            point(band.right, band.top),
          ]);
          return bands.length ? `polygon(${[...left, ...right].join(', ')})` : '';
        };
        const getHiddenUnmappedRanges = (shape) => {
          const content = String(shape.content || '');
          const coverage = typeof shape.unmappedTextCoverage === 'number'
            && Number.isFinite(shape.unmappedTextCoverage)
            ? Math.max(0, Math.min(100, Math.round(shape.unmappedTextCoverage)))
            : 100;
          if (coverage >= 100 || !content) return [];
          const selections = (Array.isArray(shape.selections) ? shape.selections : [])
            .map((range) => ({
              start: Math.max(0, Math.min(content.length, Math.round(Number(range.start) || 0))),
              end: Math.max(0, Math.min(content.length, Math.round(Number(range.end) || 0))),
            }))
            .filter((range) => range.start < range.end);
          const words = [...content.matchAll(/\S+/gu)].map((match) => {
            const start = match.index || 0;
            return {
              start,
              end: start + match[0].length,
              weight: Math.max(1, Array.from(match[0]).length),
            };
          }).filter((word) => !selections.some((selection) => (
            word.start < selection.end && word.end > selection.start
          )));
          if (coverage <= 0) return words.map(({ start, end }) => ({ start, end }));
          const wordStarts = new Set(words.map((word) => word.start));
          const persistedOrder = [];
          (Array.isArray(shape.unmappedWordOrder) ? shape.unmappedWordOrder : [])
            .forEach((entry) => {
              const start = typeof entry === 'number' && Number.isFinite(entry)
                ? Math.round(entry)
                : -1;
              if (wordStarts.has(start) && !persistedOrder.includes(start)) {
                persistedOrder.push(start);
              }
            });
          const orderByStart = new Map(persistedOrder.map((start, index) => [start, index]));
          const orderedWords = [...words].sort((left, right) => {
            const leftRank = orderByStart.get(left.start);
            const rightRank = orderByStart.get(right.start);
            if (leftRank !== undefined || rightRank !== undefined) {
              if (leftRank === undefined) return 1;
              if (rightRank === undefined) return -1;
              return leftRank - rightRank;
            }
            return left.start - right.start;
          });
          const totalWeight = orderedWords.reduce((total, word) => total + word.weight, 0);
          const targetWeight = totalWeight * coverage / 100;
          let visibleCount = 0;
          let visibleWeight = 0;
          let closestError = targetWeight;
          orderedWords.forEach((word, index) => {
            const nextWeight = visibleWeight + word.weight;
            const nextError = Math.abs(nextWeight - targetWeight);
            if (nextError < closestError) {
              visibleCount = index + 1;
              closestError = nextError;
            }
            visibleWeight = nextWeight;
          });
          const visibleStarts = new Set(
            orderedWords.slice(0, visibleCount).map((word) => word.start),
          );
          return words.filter((word) => !visibleStarts.has(word.start));
        };
        shapes.forEach((shape) => {
          const owner = layerById.get(String(shape.layerId || ''));
          const hasOwnerTexture = Boolean(
            owner?.assets?.texture
            || (Array.isArray(owner?.assets?.textureFrames) && owner.assets.textureFrames.length > 0)
          );
          const box = document.createElement('div');
          box.dataset.txtShapeId = String(shape.id || '');
          box.style.position = 'absolute';
          box.style.left = `${Number(shape.x) || 0}px`;
          box.style.top = `${Number(shape.y) || 0}px`;
          box.style.width = `${Math.max(1, Number(shape.width) || 1)}px`;
          box.style.height = `${Math.max(1, Number(shape.height) || 1)}px`;
          const { font, fontSize, lineHeight } = getTextFontMetrics(shape);
          const lineBlockClipPath = getLineBlockClipPath(shape);
          if (lineBlockClipPath) box.style.clipPath = lineBlockClipPath;
          box.style.overflow = 'hidden';
          box.style.boxSizing = 'border-box';
          box.style.padding = `${getPadding(shape)}px`;
          box.style.whiteSpace = 'pre-wrap';
          box.style.wordBreak = 'normal';
          box.style.overflowWrap = 'break-word';
          box.style.pointerEvents = 'auto';
          box.style.userSelect = 'text';
          box.style.cursor = 'text';
          box.style.color = hasOwnerTexture ? 'transparent' : String(shape.color || '#000000');
          if (!hasOwnerTexture) box.dataset.semanticFallback = 'true';
          const columns = Math.max(1, Math.min(6, Math.round(Number(shape.columns) || 1)));
          const columnGap = columns > 1 ? lineHeight / 2 : 0;
          box.style.columnCount = String(columns);
          box.style.columnGap = `${columnGap}px`;
          box.style.columnFill = 'auto';
          box.style.fontFamily = font.stack;
          box.style.fontSize = `${fontSize}px`;
          box.style.lineHeight = `${lineHeight}px`;
          box.style.textAlign = ['left', 'center', 'right'].includes(shape.textAlign)
            ? shape.textAlign
            : 'left';
          box.style.setProperty('--txt-selection-color', String(shape.selectionColor || '#ffffff'));
          box.style.setProperty('--txt-selection-bg', String(shape.selectionBackgroundColor || '#000000'));
          box.style.setProperty('--txt-base-color', String(shape.color || '#000000'));
          const content = String(shape.content || '');
          const ranges = Array.isArray(shape.selections) ? shape.selections : [];
          const colorRanges = Array.isArray(shape.colorRanges) ? shape.colorRanges : [];
          const nonCanonicalState = typeof shape.nonCanonicalState === 'string'
            ? shape.nonCanonicalState
            : 'none';
          const hiddenUnmappedRanges = getHiddenUnmappedRanges(shape);
          const boundaries = new Set([0, content.length]);
          ranges.forEach((range) => {
            boundaries.add(Math.max(0, Math.min(content.length, Number(range.start) || 0)));
            boundaries.add(Math.max(0, Math.min(content.length, Number(range.end) || 0)));
          });
          colorRanges.forEach((range) => {
            boundaries.add(Math.max(0, Math.min(content.length, Number(range.start) || 0)));
            boundaries.add(Math.max(0, Math.min(content.length, Number(range.end) || 0)));
          });
          hiddenUnmappedRanges.forEach((range) => {
            boundaries.add(range.start);
            boundaries.add(range.end);
          });
          const ordered = [...boundaries].sort((a, b) => a - b);
          if (columns === 1 && (shape.regionKind === 'oval' || shape.regionKind === 'freehand')) {
            ['left', 'right'].forEach((side) => {
              const inset = document.createElement('span');
              inset.dataset.flowInset = side;
              inset.setAttribute('aria-hidden', 'true');
              inset.style.cssFloat = side;
              inset.style.width = '50%';
              inset.style.height = '100%';
              inset.style.shapeOutside = getFlowInsetPath(shape, side);
              box.appendChild(inset);
            });
          }
          for (let index = 0; index < ordered.length - 1; index += 1) {
            const start = ordered[index];
            const end = ordered[index + 1];
            const selected = ranges.some((range) => start >= Number(range.start) && start < Number(range.end));
            if (selected) {
              const colorRange = colorRanges.find((range) => (
                start >= Number(range.start) && start < Number(range.end)
              ));
              let sourceIndex = start;
              for (const character of content.slice(start, end)) {
                const cell = document.createElement('span');
                cell.textContent = character;
                cell.dataset.txtShapeCellStart = String(sourceIndex);
                sourceIndex += character.length;
                cell.dataset.txtShapeCellEnd = String(sourceIndex);
                cell.dataset.canonicalSelected = 'true';
                const treatment = Array.isArray(shape.selectionTreatments)
                  ? shape.selectionTreatments.find((range) => (
                      sourceIndex - character.length >= Number(range.start)
                      && sourceIndex - character.length < Number(range.end)
                    ))?.treatment
                  : undefined;
                if (treatment) {
                  cell.dataset.selectionTreatment = String(treatment);
                  if (treatment === 'overwritten') cell.dataset.overwriteText = character;
                  if (treatment === 'invisible' || treatment === 'invisible-crossed-out') {
                    cell.dataset.inactiveState = nonCanonicalState;
                    if (nonCanonicalState === 'overwritten') {
                      cell.dataset.overwriteText = character;
                    }
                  }
                }
                if (colorRange?.color) {
                  cell.style.setProperty('--txt-selection-bg', String(colorRange.color));
                  cell.style.setProperty('--txt-selection-color', String(shape.selectionColor || '#ffffff'));
                }
                box.appendChild(cell);
              }
              continue;
            }
            const isUnmappedHidden = hiddenUnmappedRanges.some((range) => (
              start >= range.start && start < range.end
            ));
            if (nonCanonicalState === 'none') {
              const span = document.createElement('span');
              span.textContent = content.slice(start, end);
              if (isUnmappedHidden) span.dataset.unmappedHidden = 'true';
              box.appendChild(span);
              continue;
            }
            let sourceIndex = start;
            for (const character of content.slice(start, end)) {
              const cell = document.createElement('span');
              cell.textContent = character;
              cell.dataset.txtShapeCellStart = String(sourceIndex);
              sourceIndex += character.length;
              cell.dataset.txtShapeCellEnd = String(sourceIndex);
              cell.dataset.nonCanonicalState = nonCanonicalState;
              if (nonCanonicalState !== 'selected') {
                cell.dataset.selectionTreatment = nonCanonicalState;
                if (nonCanonicalState === 'overwritten') cell.dataset.overwriteText = character;
              }
              if (isUnmappedHidden) cell.dataset.unmappedHidden = 'true';
              box.appendChild(cell);
            }
          }
          stage.appendChild(box);
        });
        overlay.appendChild(stage);
        document.body.appendChild(overlay);
        const updateSelectionFillGaps = () => {
          const canvasRect = canvas.getBoundingClientRect();
          const canvasHeight = Math.max(1, Number(metadata.project?.height) || 1);
          const scaleY = canvasRect.height / canvasHeight;
          overlay.querySelectorAll('[data-txt-shape-id]').forEach((box) => {
            const cell = box.querySelector('[data-txt-shape-cell-start]');
            const cellRect = cell?.getClientRects()[0];
            const lineHeight = Number.parseFloat(getComputedStyle(box).lineHeight);
            const inlineHeight = cellRect && scaleY > 0 ? cellRect.height / scaleY : lineHeight;
            const fillGap = Math.max(0, Math.min(lineHeight, lineHeight - inlineHeight));
            box.style.setProperty('--txt-selection-fill-gap', `${fillGap}px`);
          });
        };
        const position = () => {
          const rect = canvas.getBoundingClientRect();
          const width = Math.max(1, Number(metadata.project?.width) || 1);
          const height = Math.max(1, Number(metadata.project?.height) || 1);
          overlay.style.left = `${rect.left + window.scrollX}px`;
          overlay.style.top = `${rect.top + window.scrollY}px`;
          overlay.style.width = `${rect.width}px`;
          overlay.style.height = `${rect.height}px`;
          stage.style.transform = `scale(${rect.width / width}, ${rect.height / height})`;
          updateSelectionFillGaps();
        };
        position();
        window.addEventListener('resize', position);
        txtShapePositionCleanup = () => window.removeEventListener('resize', position);
        if (typeof ResizeObserver === 'function') {
          txtShapeResizeObserver = new ResizeObserver(position);
          txtShapeResizeObserver.observe(canvas);
        }
        if (document.fonts?.ready) {
          void document.fonts.ready.then(() => {
            if (overlay.isConnected) position();
          });
        }
      };

      const computeScale = (metadata) => {
        const viewport = metadata?.viewport ?? {};
        const viewportPreset = metadata?.settings?.viewportPreset;
        const width = Number(viewport.designWidth ?? viewport.width) || 0;
        const height = Number(viewport.designHeight ?? viewport.height) || 0;
        if (!width || !height) {
          return 1;
        }

        const viewportWidth = window.innerWidth || width;
        const viewportHeight = window.innerHeight || height;
        const widthRatio = viewportWidth / width;
        const heightRatio = viewportHeight / height;

        if (!Number.isFinite(widthRatio) || !Number.isFinite(heightRatio) || widthRatio <= 0 || heightRatio <= 0) {
          return 1;
        }

        if (viewport.mode === 'fill' || viewport.mode === 'fit' || viewport.mode === 'cover') {
          return 1;
        }

        if (viewportPreset === 'embed-fill') {
          const baseScale = Math.max(widthRatio, heightRatio);
          return baseScale > 0 ? baseScale : 1;
        }

        if (viewportPreset === 'embed-fit') {
          const baseScale = Math.min(widthRatio, heightRatio);
          return baseScale > 0 ? baseScale : 1;
        }

        const baseScale = Math.min(widthRatio, heightRatio, 1);
        return baseScale > 0 ? baseScale : 1;
      };

      const drawMetadata = async (metadata) => {
        if (!metadata) {
          return;
        }
        pendingMetadata = metadata;
        if (isRendering) {
          return;
        }
        isRendering = true;
        while (pendingMetadata) {
          const current = pendingMetadata;
          pendingMetadata = null;
          try {
            const scale = computeScale(current);
            debugLog('[DEBUG] drawMetadata computed scale', {
              scale,
              viewport: current?.viewport,
              windowSize: { width: window.innerWidth, height: window.innerHeight }
            });
            if (current?.viewport?.mode) {
              document.body.dataset.viewportMode = current.viewport.mode;
            } else {
              delete document.body.dataset.viewportMode;
            }
            if (current?.settings?.viewportPreset) {
              document.body.dataset.viewportPreset = current.settings.viewportPreset;
            } else {
              delete document.body.dataset.viewportPreset;
            }
            const opts = current?.viewport?.mode === 'fixed'
              ? {}
              : { scale };
            const summary = await renderVesselWebGL(current, canvas, opts);
            mountTxtShapes(current);
            debugLog('[DEBUG] drawMetadata render summary', summary);
            lastMetadata = current;
          } catch (error) {
            console.error('Failed to render Goblet bundle', error);
            break;
          }
        }
        isRendering = false;
      };

      const renderBundle = async (file) => {
        if (!file) {
          return;
        }
        try {
          const text = await file.text();
          const metadata = JSON.parse(text);
          if (isDiagnosticsEnabled()) {
            metadata?.layers?.forEach((layer, idx) => {
              const brushState = layer?.colorCycle?.brushState;
              const indexBuffer = brushState?.indexBuffer;
              if (indexBuffer) {
                debugLog('[DEBUG] Layer index buffer summary', {
                  index: idx,
                  layerId: layer?.id,
                  type: typeof indexBuffer,
                  isArray: Array.isArray(indexBuffer),
                  length: typeof indexBuffer === 'string' ? indexBuffer.length : indexBuffer?.length,
                  preview: Array.isArray(indexBuffer)
                    ? indexBuffer.slice(0, 16)
                    : typeof indexBuffer === 'string'
                      ? indexBuffer.slice(0, 64)
                      : null
                });
              }
            });
          }
          void drawMetadata(metadata);
        } catch (error) {
          console.error('Failed to load Goblet bundle', error);
        }
      };

      const handleFileSelection = (event) => {
        const file = event?.target?.files?.[0];
        if (file) {
          void renderBundle(file);
        }
        if (event?.target) {
          event.target.value = '';
        }
      };

      fileInput.addEventListener('change', handleFileSelection);

      window.addEventListener('dragover', (event) => {
        event.preventDefault();
      });

      window.addEventListener('drop', (event) => {
        event.preventDefault();
        const file = event.dataTransfer?.files?.[0];
        if (file) {
          void renderBundle(file);
        }
      });

      window.addEventListener('keydown', (event) => {
        const isOpenShortcut = (event.key === 'o' || event.key === 'O') && (event.metaKey || event.ctrlKey);
        if (isOpenShortcut) {
          event.preventDefault();
          fileInput.click();
        }
      });


      const readyMessage = 'Goblet ready. Drop a bundle or use Ctrl/Cmd+O to open a file.';
      setStatus(readyMessage);
    </script>
  </body>
</html>
