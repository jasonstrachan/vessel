name: Build Vessel Static Export

on:
  pull_request:
    branches: [ main, master, poc1 ]
  push:
    branches: [ main, master, poc1 ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: "vessel-static-export"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve last successful Vessel export baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          response_path="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=1" \
            > "${response_path}"
          base_sha="$(node -e "const fs=require('fs'); const body=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(body.workflow_runs?.[0]?.head_sha ?? '')" "${response_path}")"
          if [ -z "${base_sha}" ]; then
            base_sha="${PUSH_BEFORE_SHA}"
          fi
          if [ -z "${base_sha}" ] || echo "${base_sha}" | grep -Eq '^0+$'; then
            echo "::error::Could not resolve a successful Vessel export baseline."
            exit 1
          fi
          echo "PLAYBACK_GUARD_BASE_SHA=${base_sha}" >> "${GITHUB_ENV}"
          echo "Playback guard will inspect ${base_sha}...${GITHUB_SHA}"
          
      - name: Install dependencies
        run: npm ci

      - name: Run production dependency audit
        run: npm run audit:prod

      - name: Run full dependency audit (report only)
        run: npm run audit:full || true

      - name: Export full dependency audit report (JSON)
        run: npm run audit:full:json
        continue-on-error: true

      - name: Build full dependency audit summary (markdown)
        run: npm run audit:full:summary
        continue-on-error: true

      - name: Upload full audit report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-audit-report
          path: |
            audit-full.json
            audit-full-summary.md
          if-no-files-found: ignore

      - name: Verify Goblet runtime assets are up to date
        run: npm run verify:goblet-runtime

      - name: Check playback-sensitive change gates
        run: npm run verify:cc-render-gate

      - name: Run lint
        run: npm run lint

      - name: Run architecture guardrails
        run: npm run architecture:check

      - name: Run type check
        run: npm run type-check

      - name: Run worker type check
        run: npm run type-check:workers

      - name: Run test type check
        run: npm run type-check:tests

      - name: Run load-project guardrail tests
        run: npm run test:load-project-modal:guardrails

      - name: Run color-cycle runtime parity matrix
        run: npm run test:cc-runtime-parity

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run color-cycle GPU rendered parity
        run: npm run test:cc-runtime-gpu-parity

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build:github
        
      - name: Upload static export artifact
        uses: actions/upload-artifact@v7
        with:
          name: vessel-static-export
          path: ./out

      - name: Trigger website Vessel sync
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          VESSEL_SHA: ${{ github.sha }}
          VESSEL_REF: ${{ github.ref_name }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$WEBSITE_DEPLOY_TOKEN" ]; then
            echo "::error::Missing WEBSITE_DEPLOY_TOKEN secret. Add a token that can dispatch workflows in jasonstrachan/jasonstrachan.com."
            exit 1
          fi

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WEBSITE_DEPLOY_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jasonstrachan/jasonstrachan.com/dispatches \
            -d "{\"event_type\":\"vessel-static-export\",\"client_payload\":{\"vessel_sha\":\"${VESSEL_SHA}\",\"vessel_ref\":\"${VESSEL_REF}\",\"source_run_id\":\"${SOURCE_RUN_ID}\"}}"
